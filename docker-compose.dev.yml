name: java-db-test
services:
  test-db-mysql:
    image: mysql:8.0
    container_name: test-db-mysql
    restart: no
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_DATABASE: demo
    ports:
      - '3306' # 不寫宿主機的特定 port 就會自動隨機映射，框架會自動處理 datasource
    labels:
      org.springframework.boot.service-connection: mysql # 透過 label 幫助辨識使用的 image
  test-db-redis:
    image: redis:7.0-alpine
    container_name: test-db-redis
    restart: no
    ports:
      - '6379'
    labels:
      org.springframework.boot.service-connection: redis
